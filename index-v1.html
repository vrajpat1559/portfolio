<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vraj — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ---------- tokens ---------- */
  :root {
    --bg: #0c0e12;
    --bg-2: #12151b;
    --card: #161a21;
    --card-hover: #1b2028;
    --line: #262c36;
    --line-strong: #364050;
    --text: #e8eaee;
    --text-2: #a4acb9;
    --text-3: #6b7482;
    --accent: #f5b544;
    --accent-2: #ffd27a;
    --accent-ink: #1a1200;
    --ok: #4cd08a;
    --live: #f5b544;
    --plan: #7aa2ff;
    --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 10px 30px -10px rgba(0,0,0,.6);
    --radius: 14px;
    --serif: "Instrument Serif", Georgia, "Times New Roman", serif;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  [data-theme="light"] {
    --bg: #f7f5f0;
    --bg-2: #efece5;
    --card: #ffffff;
    --card-hover: #fffdf8;
    --line: #e2ddd2;
    --line-strong: #cbc4b5;
    --text: #17191d;
    --text-2: #4d5460;
    --text-3: #8a8f99;
    --accent: #b8710a;
    --accent-2: #d98a14;
    --accent-ink: #fff8ea;
    --ok: #1f9a5a;
    --live: #b8710a;
    --plan: #3b63d6;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 12px 30px -16px rgba(30,20,0,.25);
  }

  /* ---------- base ---------- */
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    background-image:
      radial-gradient(1200px 600px at 80% -10%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 60%),
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: auto, 48px 48px, 48px 48px;
    background-position: 0 0, -1px -1px, -1px -1px;
  }
  body::before {
    content: "";
    position: fixed; inset: 0; z-index: -1;
    background: linear-gradient(180deg, transparent, var(--bg) 90%);
    pointer-events: none;
  }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }
  .mono { font-family: var(--mono); font-size: 12.5px; letter-spacing: .02em; }
  .muted { color: var(--text-2); }
  .dim { color: var(--text-3); }

  /* ---------- nav ---------- */
  nav {
    position: sticky; top: 0; z-index: 20;
    backdrop-filter: blur(14px);
    background: color-mix(in srgb, var(--bg) 78%, transparent);
    border-bottom: 1px solid var(--line);
  }
  nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 60px; gap: 16px; }
  .brand { font-family: var(--serif); font-size: 22px; letter-spacing: .01em; }
  .brand span { color: var(--accent); }
  .navlinks { display: flex; gap: 6px; align-items: center; }
  .navlinks a, .btn {
    padding: 7px 12px; border-radius: 999px; font-size: 13.5px; font-weight: 500;
    color: var(--text-2); border: 1px solid transparent; cursor: pointer; background: none;
    font-family: var(--sans); transition: .15s;
  }
  .navlinks a:hover, .btn:hover { color: var(--text); background: var(--card); border-color: var(--line); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
  .btn.primary:hover { background: var(--accent-2); color: var(--accent-ink); }
  .iconbtn { width: 36px; height: 36px; display: grid; place-items: center; padding: 0; }
  .iconbtn svg { width: 17px; height: 17px; }

  /* ---------- hero ---------- */
  header.hero { padding-block: 88px 56px; }
  .eyebrow { display: inline-flex; align-items: center; gap: 8px; color: var(--text-2); margin-bottom: 18px; }
  .eyebrow .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 20%, transparent); flex: none; }
  h1 {
    font-family: var(--serif); font-weight: 400; font-size: clamp(44px, 7vw, 76px);
    line-height: 1.02; margin: 0 0 20px; letter-spacing: -.01em;
  }
  h1 em { font-style: italic; color: var(--accent); }
  .lede { font-size: clamp(17px, 2vw, 20px); color: var(--text-2); max-width: 640px; margin: 0 0 30px; }
  .hero-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .hero-actions .btn { border-color: var(--line); background: var(--card); color: var(--text); }
  .hero-actions .btn.primary { background: var(--accent); color: var(--accent-ink); }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; margin-top: 56px; }
  .stat { background: var(--card); padding: 18px 20px; }
  .stat b { display: block; font-family: var(--serif); font-size: 34px; font-weight: 400; line-height: 1; margin-bottom: 6px; }
  .stat span { color: var(--text-3); font-size: 12.5px; text-transform: uppercase; letter-spacing: .08em; }

  /* ---------- sections ---------- */
  section { padding: 56px 0; }
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 28px; flex-wrap: wrap; }
  h2 { font-family: var(--serif); font-weight: 400; font-size: 34px; margin: 0; letter-spacing: -.01em; }
  h2 small { font-family: var(--mono); font-size: 12px; color: var(--text-3); margin-left: 12px; letter-spacing: .05em; }

  /* ---------- filters ---------- */
  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card);
    color: var(--text-2); font-size: 13px; cursor: pointer; font-family: var(--sans); transition: .15s;
  }
  .chip:hover { border-color: var(--line-strong); color: var(--text); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }

  /* ---------- timeline ---------- */
  .timeline { position: relative; padding-left: 40px; }
  .timeline::before {
    content: ""; position: absolute; left: 11px; top: 8px; bottom: 8px; width: 2px;
    background: linear-gradient(var(--line-strong), var(--line) 90%, transparent);
  }
  .year {
    position: relative; margin: 10px 0 18px; font-family: var(--mono); font-size: 12px;
    color: var(--text-3); letter-spacing: .12em; text-transform: uppercase;
  }
  .year::before {
    content: ""; position: absolute; left: -40px; top: 6px; width: 24px; height: 8px;
    background: var(--bg); border-top: 2px solid var(--line-strong);
  }
  .tl-item { position: relative; margin-bottom: 22px; }
  .tl-item.hidden { display: none; }
  .tl-item::before {
    content: ""; position: absolute; left: -35px; top: 26px; width: 12px; height: 12px; border-radius: 50%;
    background: var(--bg); border: 2px solid var(--line-strong); z-index: 1; transition: .2s;
  }
  .tl-item[data-status="in-progress"]::before { border-color: var(--live); box-shadow: 0 0 0 4px color-mix(in srgb, var(--live) 18%, transparent); }
  .tl-item[data-status="completed"]::before  { border-color: var(--ok); background: var(--ok); }
  .tl-item[data-status="planned"]::before    { border-color: var(--plan); border-style: dashed; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 22px 24px; transition: .2s;
  }
  .card:hover { background: var(--card-hover); border-color: var(--line-strong); transform: translateY(-1px); }
  .card-date { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .card h3 { font-family: var(--serif); font-weight: 400; font-size: 26px; margin: 0 0 8px; letter-spacing: -.005em; line-height: 1.15; }
  .status { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .status.in-progress { color: var(--live); background: color-mix(in srgb, var(--live) 14%, transparent); }
  .status.completed   { color: var(--ok);   background: color-mix(in srgb, var(--ok) 14%, transparent); }
  .status.planned     { color: var(--plan); background: color-mix(in srgb, var(--plan) 14%, transparent); }
  .featured-star { color: var(--accent); font-size: 12px; margin-left: 6px; vertical-align: middle; }
  .summary { color: var(--text-2); margin: 0 0 14px; max-width: 70ch; }
  .tech { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
  .tech span { font-family: var(--mono); font-size: 11.5px; padding: 3px 8px; border-radius: 6px; background: var(--bg-2); border: 1px solid var(--line); color: var(--text-2); }

  .card-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
  .links { display: flex; gap: 12px; flex-wrap: wrap; }
  .links a { font-size: 13.5px; font-weight: 500; color: var(--accent); display: inline-flex; align-items: center; gap: 4px; }
  .links a:hover { text-decoration: underline; }
  .expand { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); background: none; border: none; cursor: pointer; font-family: var(--sans); padding: 4px 0; margin-left: auto; }
  .expand:hover { color: var(--text); }
  .expand svg { width: 14px; height: 14px; transition: .2s; }
  .card.open .expand svg { transform: rotate(180deg); }

  .details { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s ease; }
  .card.open .details { grid-template-rows: 1fr; }
  .details > div { overflow: hidden; }
  .details-inner { border-top: 1px dashed var(--line); margin-top: 16px; padding-top: 18px; display: grid; grid-template-columns: 1.3fr 1fr; gap: 28px; }
  .details h4 { margin: 0 0 10px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); font-weight: 600; }
  .details p { margin: 0 0 14px; color: var(--text-2); font-size: 15px; }
  .highlights { margin: 0; padding-left: 18px; color: var(--text-2); font-size: 14.5px; }
  .highlights li { margin-bottom: 6px; }
  .highlights li::marker { color: var(--accent); }
  .milestones { list-style: none; margin: 0; padding: 0; border-left: 1px solid var(--line); }
  .milestones li { position: relative; padding: 0 0 12px 16px; font-size: 14px; color: var(--text-2); }
  .milestones li::before { content: ""; position: absolute; left: -4px; top: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .milestones .d { display: block; font-family: var(--mono); font-size: 11.5px; color: var(--text-3); margin-bottom: 1px; }
  .todo { color: var(--plan) !important; font-family: var(--mono); font-size: 12.5px !important; }

  /* ---------- skills ---------- */
  .skills { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .skill { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .skill b { font-weight: 500; font-size: 15px; }
  .skill span { font-family: var(--mono); font-size: 11.5px; color: var(--text-3); white-space: nowrap; }

  /* ---------- footer ---------- */
  footer { border-top: 1px solid var(--line); padding-block: 32px 48px; color: var(--text-3); font-size: 13.5px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  footer a { color: var(--text-2); }
  footer a:hover { color: var(--accent); }

  .empty { color: var(--text-3); padding: 24px; border: 1px dashed var(--line); border-radius: var(--radius); text-align: center; }

  @media (max-width: 720px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .details-inner { grid-template-columns: 1fr; }
    header.hero { padding-block: 56px 40px; }
    .navlinks a:not(.iconbtn) { display: none; }
    .timeline { padding-left: 30px; }
    .tl-item::before { left: -25px; }
    .year::before { left: -30px; width: 16px; }
    .card { padding: 18px 18px; }
  }

  /* ---------- print (for resume / PDF) ---------- */
  @media print {
    :root, [data-theme="dark"], [data-theme="light"] {
      --bg: #fff; --bg-2: #f5f5f5; --card: #fff; --card-hover: #fff; --line: #ddd; --line-strong: #bbb;
      --text: #111; --text-2: #333; --text-3: #666; --accent: #8a5a00; --accent-2: #8a5a00; --accent-ink: #fff;
      --live: #8a5a00; --ok: #1f7a45; --plan: #2b4fb8; --shadow: none;
    }
    body { background: #fff; font-size: 12px; }
    body::before { display: none; }
    nav, .filters, .expand, .hero-actions, .no-print { display: none !important; }
    header.hero { padding-block: 0 20px; }
    h1 { font-size: 34px; }
    .stats { margin-top: 20px; }
    section { padding: 20px 0; }
    .tl-item { break-inside: avoid; }
    .tl-item.hidden { display: block; }
    .card { box-shadow: none; padding: 14px 16px; }
    .card:hover { transform: none; }
    .details { grid-template-rows: 1fr !important; }
    .card h3 { font-size: 18px; }
    a[href^="http"]::after { content: " (" attr(href) ")"; font-size: 10px; color: #666; }
  }
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <a class="brand" href="#top" id="brand">V<span>.</span></a>
    <div class="navlinks">
      <a href="#timeline">Timeline</a>
      <a href="#skills">Skills</a>
      <a href="#contact">Contact</a>
      <button class="btn iconbtn" id="print" title="Print / save as PDF" aria-label="Print">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      </button>
      <button class="btn iconbtn" id="theme" title="Toggle theme" aria-label="Toggle theme">
        <svg id="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg id="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </div>
</nav>

<header class="hero wrap" id="top">
  <div class="eyebrow mono"><span class="dot"></span><span id="eyebrow"></span></div>
  <h1 id="headline"></h1>
  <p class="lede" id="tagline"></p>
  <div class="hero-actions" id="hero-actions"></div>
  <div class="stats" id="stats"></div>
</header>

<main class="wrap">
  <section id="timeline">
    <div class="sec-head">
      <h2>Project timeline <small id="tl-count"></small></h2>
      <div class="filters" id="filters"></div>
    </div>
    <div class="timeline" id="tl"></div>
  </section>

  <section id="skills">
    <div class="sec-head"><h2>Tools &amp; technologies <small>derived from projects</small></h2></div>
    <div class="skills" id="skills-grid"></div>
  </section>

  <section id="contact">
    <div class="sec-head"><h2>Contact</h2></div>
    <p class="muted" style="margin:0 0 14px; max-width:60ch">Open to internships, co-ops, and hardware design / verification roles. The fastest way to reach me is email.</p>
    <div class="links" id="contact-links"></div>
  </section>
</main>

<footer class="wrap">
  <span id="foot-left"></span>
  <span>Last updated <span id="foot-date" class="mono"></span></span>
</footer>

<script src="projects.js"></script>
<script>
(function () {
  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const parse = d => { const [y, m, dd] = d.split("-").map(Number); return new Date(y, m - 1, dd || 1); };
  const fmt = d => { const x = parse(d); return `${MONTHS[x.getMonth()]} ${x.getFullYear()}`; };
  const fmtDay = d => { const x = parse(d); return `${MONTHS[x.getMonth()]} ${x.getDate()}, ${x.getFullYear()}`; };
  const STATUS_LABEL = { "in-progress": "In progress", completed: "Completed", planned: "Planned" };
  const isTodo = s => /\bTODO\b/.test(s || "");

  /* ---- theme ---- */
  const root = document.documentElement;
  const setTheme = t => {
    root.dataset.theme = t;
    $("#ico-sun").style.display = t === "dark" ? "" : "none";
    $("#ico-moon").style.display = t === "dark" ? "none" : "";
    try { localStorage.setItem("theme", t); } catch (e) {}
  };
  let saved = null; try { saved = localStorage.getItem("theme"); } catch (e) {}
  setTheme(saved || "dark");
  $("#theme").onclick = () => setTheme(root.dataset.theme === "dark" ? "light" : "dark");
  $("#print").onclick = () => window.print();

  /* ---- hero ---- */
  const first = PROFILE.name.split(" ")[0];
  $("#brand").innerHTML = `${esc(first[0])}<span>.</span>`;
  document.title = `${PROFILE.name} — Portfolio`;
  const live = PROJECTS.filter(p => p.status === "in-progress");
  $("#eyebrow").textContent = live.length
    ? `Currently building: ${live.map(p => p.title).join(" · ")}`
    : PROFILE.title;
  $("#headline").innerHTML = `${esc(PROFILE.name)}<br><em>${esc(PROFILE.title)}</em>`;
  $("#tagline").textContent = PROFILE.tagline;

  const actions = [`<a class="btn primary" href="#timeline">See the timeline</a>`];
  if (PROFILE.email) actions.push(`<a class="btn" href="mailto:${esc(PROFILE.email)}">Email me</a>`);
  PROFILE.links.forEach(l => actions.push(`<a class="btn" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`));
  $("#hero-actions").innerHTML = actions.join("");

  /* ---- stats ---- */
  const allTech = [...new Set(PROJECTS.flatMap(p => p.tech))];
  const starts = PROJECTS.map(p => parse(p.start)).sort((a, b) => a - b);
  const since = starts.length ? `${MONTHS[starts[0].getMonth()]} ${starts[0].getFullYear()}` : "—";
  $("#stats").innerHTML = [
    [PROJECTS.length, "Projects"],
    [live.length, "In progress"],
    [allTech.length, "Technologies"],
    [since, "Building since"],
  ].map(([b, s]) => `<div class="stat"><b>${esc(b)}</b><span>${s}</span></div>`).join("");

  /* ---- filters ---- */
  const tags = [...new Set(PROJECTS.flatMap(p => p.tags))].sort();
  let active = "all";
  const renderFilters = () => {
    $("#filters").innerHTML = ["all", ...tags].map(t =>
      `<button class="chip ${t === active ? "active" : ""}" data-tag="${esc(t)}">${t === "all" ? "All" : esc(t)}</button>`).join("");
    $("#filters").querySelectorAll(".chip").forEach(c => c.onclick = () => { active = c.dataset.tag; renderFilters(); applyFilter(); });
  };
  const applyFilter = () => {
    let shown = 0;
    document.querySelectorAll(".tl-item").forEach(el => {
      const ok = active === "all" || el.dataset.tags.split("|").includes(active);
      el.classList.toggle("hidden", !ok); if (ok) shown++;
    });
    document.querySelectorAll(".year").forEach(y => {
      const any = [...y.parentElement.querySelectorAll(`.tl-item[data-year="${y.dataset.year}"]`)].some(i => !i.classList.contains("hidden"));
      y.style.display = any ? "" : "none";
    });
    $("#tl-count").textContent = `${shown} of ${PROJECTS.length}`;
  };

  /* ---- timeline ---- */
  const sorted = [...PROJECTS].sort((a, b) => parse(b.start) - parse(a.start));
  let html = "", lastYear = null;
  sorted.forEach(p => {
    const year = parse(p.start).getFullYear();
    if (year !== lastYear) { html += `<div class="year" data-year="${year}">${year}</div>`; lastYear = year; }
    const range = p.end ? `${fmt(p.start)} – ${fmt(p.end)}` : `${fmt(p.start)} – ${p.status === "planned" ? "upcoming" : "present"}`;
    const milestones = [...(p.milestones || [])].sort((a, b) => parse(a.date) - parse(b.date));
    html += `
      <article class="tl-item" data-status="${esc(p.status)}" data-year="${year}" data-tags="${esc((p.tags || []).join("|"))}">
        <div class="card" id="p-${esc(p.id)}">
          <div class="card-date">
            <span class="mono dim">${esc(range)}</span>
            <span class="status ${esc(p.status)}">${STATUS_LABEL[p.status] || esc(p.status)}</span>
          </div>
          <h3>${esc(p.title)}${p.featured ? '<span class="featured-star" title="Featured">★</span>' : ""}</h3>
          <p class="summary">${esc(p.summary)}</p>
          <div class="tech">${(p.tech || []).map(t => `<span>${esc(t)}</span>`).join("")}</div>
          <div class="card-foot">
            <div class="links">${(p.links || []).map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join("")}</div>
            <button class="expand" aria-expanded="false">Details <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></button>
          </div>
          <div class="details"><div><div class="details-inner">
            <div>
              <h4>About</h4>
              <p class="${isTodo(p.description) ? "todo" : ""}">${esc(p.description)}</p>
              ${(p.highlights || []).length ? `<h4>Highlights</h4><ul class="highlights">${p.highlights.map(h => `<li class="${isTodo(h) ? "todo" : ""}">${esc(h)}</li>`).join("")}</ul>` : ""}
            </div>
            <div>
              <h4>Milestones</h4>
              ${milestones.length ? `<ul class="milestones">${milestones.map(m => `<li><span class="d">${esc(fmtDay(m.date))}</span>${esc(m.text)}</li>`).join("")}</ul>` : `<p class="dim">No milestones yet.</p>`}
            </div>
          </div></div></div>
        </div>
      </article>`;
  });
  $("#tl").innerHTML = html || `<div class="empty">No projects yet — add one in projects.js</div>`;
  document.querySelectorAll(".expand").forEach(b => b.onclick = () => {
    const card = b.closest(".card"); const open = card.classList.toggle("open");
    b.setAttribute("aria-expanded", open);
  });
  renderFilters(); applyFilter();

  /* ---- skills ---- */
  const count = {};
  PROJECTS.forEach(p => (p.tech || []).forEach(t => count[t] = (count[t] || 0) + 1));
  $("#skills-grid").innerHTML = Object.entries(count).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
    .map(([t, n]) => `<div class="skill"><b>${esc(t)}</b><span>${n} project${n > 1 ? "s" : ""}</span></div>`).join("");

  /* ---- contact / footer ---- */
  const cl = [];
  if (PROFILE.email) cl.push(`<a href="mailto:${esc(PROFILE.email)}">${esc(PROFILE.email)}</a>`);
  PROFILE.links.forEach(l => cl.push(`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`));
  $("#contact-links").innerHTML = cl.join("");
  $("#foot-left").textContent = `© ${new Date().getFullYear()} ${PROFILE.name}${PROFILE.location ? " · " + PROFILE.location : ""}`;
  const latest = PROJECTS.flatMap(p => (p.milestones || []).map(m => m.date)).sort().pop();
  $("#foot-date").textContent = latest ? fmtDay(latest) : "";

  /* open a card if linked to directly (#p-uart) */
  if (location.hash.startsWith("#p-")) { const c = $(location.hash); if (c) { c.classList.add("open"); c.scrollIntoView({ block: "center" }); } }
})();
</script>
</body>
</html>
