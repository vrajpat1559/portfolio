<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vraj Patel — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f6fb;
    --bg-mint: #e9f6f2;
    --bg-lav: #ece8f7;
    --panel: #ffffff;
    --panel-2: #f1f3f8;
    --line: #dfe3ee;
    --line-strong: #c6ccdc;
    --text: #1b2a41;
    --text-2: #4a5670;
    --text-3: #8592a8;
    --teal: #0e8f7e;
    --teal-deep: #0b6e62;
    --blue: #2456b3;
    --purple: #8b6fd6;
    --purple-soft: #b9a6ec;
    --amber: #b8791a;
    --ok: #178f5a; --ok-soft: #e1f4ea;
    --live: #b8791a; --live-soft: #fbf0dc;
    --plan: #6f6f8a; --plan-soft: #ececf3;
    --radius: 14px;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --serif: "Instrument Serif", Georgia, "Times New Roman", serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; color: var(--text); font-family: var(--sans); font-size: 16px; line-height: 1.6;
    background: var(--bg); -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  h1, h2, h3 { margin: 0; letter-spacing: -.02em; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 40px; }
  .eyebrow { font-family: var(--mono); font-size: 12.5px; letter-spacing: .22em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 10px; }
  .eyebrow .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); flex: none; }
  .mono { font-family: var(--mono); }

  /* ---------- nav ---------- */
  nav { background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
  nav .wrap { display: flex; align-items: center; height: 84px; gap: 40px; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .logo {
    width: 48px; height: 48px; border-radius: 10px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--teal), var(--blue)); color: #fff;
  }
  .logo svg { width: 22px; height: 22px; }
  .brand-name { font-family: var(--mono); font-weight: 600; font-size: 19px; letter-spacing: .12em; }
  .brand-name span { color: var(--purple); font-weight: 400; margin: 0 10px; }
  .navlinks { display: flex; gap: 36px; font-size: 18px; color: var(--text-2); margin-left: auto; }
  .navlinks a:hover { color: var(--text); }
  .nav-status { margin-left: 56px; color: var(--teal); font-size: 12px; }

  /* ---------- hero ---------- */
  .hero-bg {
    background:
      radial-gradient(900px 600px at 0% 20%, var(--bg-mint), transparent 60%),
      radial-gradient(900px 600px at 100% 30%, var(--bg-lav), transparent 60%),
      var(--bg);
  }
  .hero { display: grid; grid-template-columns: 1.15fr 1fr; gap: 60px; padding-block: 120px 80px; align-items: center; }
  .hero .eyebrow { color: var(--teal-deep); margin-bottom: 44px; }
  h1 { font-size: clamp(56px, 6.6vw, 96px); line-height: 1; font-weight: 600; margin-bottom: 40px; }
  h1 em { font-family: var(--serif); font-style: italic; font-weight: 400; color: var(--teal); letter-spacing: 0; }
  .subhead { font-size: clamp(22px, 2.4vw, 34px); line-height: 1.35; font-weight: 400; color: var(--text); margin: 0 0 30px; max-width: 24ch; }
  .tagline { font-size: clamp(17px, 1.5vw, 22px); color: var(--text-2); margin: 0 0 56px; max-width: 46ch; line-height: 1.7; }
  .cta {
    display: inline-flex; align-items: center; justify-content: space-between; gap: 60px;
    padding: 24px 44px 24px 40px; border-radius: 12px; color: #fff; font-weight: 600; font-size: 21px;
    background: linear-gradient(90deg, var(--teal), var(--blue)); box-shadow: 0 16px 36px -18px rgba(36,86,179,.6);
    transition: .2s;
  }
  .cta:hover { transform: translateY(-2px); box-shadow: 0 22px 40px -18px rgba(36,86,179,.7); }
  .cta svg { width: 22px; height: 22px; }
  .seeking { margin-top: 52px; font-size: 18px; color: var(--text-2); }
  .seeking .mono { display: block; font-size: 14px; color: var(--text-3); margin-top: 4px; letter-spacing: .02em; }

  .figure { position: relative; }
  .fig-head { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 12.5px; letter-spacing: .18em; color: var(--text-2); margin-bottom: 20px; }
  .figure svg { width: 100%; height: auto; display: block; }
  .fig-foot { display: flex; justify-content: space-between; align-items: center; font-family: var(--mono); font-size: 12.5px; letter-spacing: .2em; color: var(--text-2); margin-top: 22px; padding: 0 8px; }
  .fig-foot .arr { color: var(--purple); font-size: 18px; letter-spacing: 0; }

  /* ---------- stats strip ---------- */
  .stats { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--panel); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .stat { padding: 40px 32px; display: flex; align-items: center; gap: 20px; border-left: 1px solid var(--line); min-width: 0; flex-wrap: wrap; }
  .stat:first-child { border-left: none; padding-left: 0; }
  .stat .big { font-family: var(--mono); font-size: clamp(22px, 2.2vw, 30px); font-weight: 500; letter-spacing: -.01em; white-space: nowrap; }
  .stat:nth-child(1) .big { color: var(--teal-deep); font-size: clamp(34px, 3.4vw, 46px); }
  .stat:nth-child(2) .big { color: var(--purple); }
  .stat:nth-child(3) .big { color: var(--amber); }
  .stat .lbl { font-size: 17px; color: var(--text); }
  .stat > div { min-width: 0; flex: 1 1 140px; }
  .stat .sub { font-size: 15px; color: var(--text-2); margin-top: 2px; }
  .stat:nth-child(2) { flex-direction: column; align-items: flex-start; gap: 14px; }

  /* ---------- sections ---------- */
  section { padding-block: 110px; }
  .sec-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 56px; flex-wrap: wrap; }
  .sec-head .eyebrow { color: var(--purple); margin-bottom: 18px; display: inline-flex; }
  .sec-head .eyebrow .dot { background: var(--purple); }
  h2 { font-size: clamp(38px, 4.2vw, 56px); font-weight: 600; line-height: 1.05; }
  h2 em { font-family: var(--serif); font-style: italic; font-weight: 400; color: var(--teal); }
  .sec-head p { margin: 0; color: var(--text-2); font-size: 18px; max-width: 44ch; }

  /* ---------- work ---------- */
  .work { display: flex; flex-direction: column; gap: 22px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 40px; display: grid; grid-template-columns: 70px 1.4fr 1fr; gap: 40px; transition: .2s; position: relative; scroll-margin-top: 110px;
  }
  .card:hover { border-color: var(--line-strong); box-shadow: 0 24px 50px -30px rgba(27,42,65,.25); }
  .card .num { font-family: var(--mono); font-size: 14px; color: var(--text-3); letter-spacing: .1em; padding-top: 6px; }
  .status { display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px; border-radius: 999px; font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
  .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .status.in-progress { color: var(--live); background: var(--live-soft); }
  .status.completed   { color: var(--ok);   background: var(--ok-soft); }
  .status.planned     { color: var(--plan); background: var(--plan-soft); }
  .card-meta { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
  .card-meta .date { font-family: var(--mono); font-size: 12.5px; color: var(--text-3); letter-spacing: .04em; }
  .card h3 { font-size: 30px; font-weight: 600; line-height: 1.15; margin-bottom: 14px; }
  .card .summary { color: var(--text-2); font-size: 17px; margin: 0 0 22px; max-width: 58ch; }
  .tech { display: flex; gap: 8px; flex-wrap: wrap; }
  .tech span { font-family: var(--mono); font-size: 12px; padding: 5px 10px; border-radius: 7px; background: var(--panel-2); color: var(--text-2); border: 1px solid var(--line); }
  .card-side h4 { margin: 0 0 14px; font-family: var(--mono); font-size: 11.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--text-3); font-weight: 500; }
  .ms { list-style: none; margin: 0 0 22px; padding: 0; border-left: 2px solid var(--line); }
  .ms li { position: relative; padding: 0 0 12px 18px; font-size: 14.5px; color: var(--text-2); line-height: 1.45; }
  .ms li::before { content: ""; position: absolute; left: -5px; top: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--purple); }
  .ms li:first-child::before { background: var(--teal); }
  .ms .d { display: block; font-family: var(--mono); font-size: 11.5px; color: var(--text-3); margin-bottom: 2px; }
  .card-links { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .card-links a { color: var(--blue); font-weight: 500; font-size: 15px; }
  .card-links a:hover { text-decoration: underline; }
  .expand { background: none; border: none; cursor: pointer; color: var(--text-2); font-family: var(--sans); font-size: 14.5px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; padding: 0; }
  .expand:hover { color: var(--text); }
  .expand svg { width: 14px; height: 14px; transition: .2s; }
  .card.open .expand svg { transform: rotate(180deg); }
  .details { grid-column: 2 / -1; display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s ease; }
  .card.open .details { grid-template-rows: 1fr; }
  .details > div { overflow: hidden; }
  .details-inner { border-top: 1px solid var(--line); padding-top: 26px; display: grid; grid-template-columns: 1.4fr 1fr; gap: 40px; }
  .details h4 { margin: 0 0 12px; font-family: var(--mono); font-size: 11.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--text-3); font-weight: 500; }
  .details p { margin: 0 0 18px; color: var(--text-2); font-size: 15.5px; }
  .hl { margin: 0; padding-left: 18px; color: var(--text-2); font-size: 15px; }
  .hl li { margin-bottom: 6px; }
  .hl li::marker { color: var(--teal); }
  .todo { color: var(--purple) !important; font-family: var(--mono); font-size: 13px !important; }

  /* ---------- about ---------- */
  .about-bg { background: linear-gradient(180deg, var(--bg), var(--bg-lav) 60%, var(--bg)); }
  #about { padding-block: 90px 56px; }
  .about { display: grid; grid-template-columns: 1.2fr 1fr; gap: 80px; align-items: start; }
  .about-h2 { margin-bottom: 28px; }
  .side-block:last-child { margin-bottom: 0; }
  .about p { font-size: 19px; color: var(--text-2); margin: 0 0 22px; line-height: 1.7; }
  .about p strong { color: var(--text); font-weight: 600; }
  .side-block { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 30px 32px; margin-bottom: 18px; }
  .side-block h4 { margin: 0 0 16px; font-family: var(--mono); font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--text); font-weight: 600; }
  .now-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .now-list li { display: flex; gap: 12px; align-items: baseline; font-size: 16px; }
  .now-list .k { font-family: var(--mono); font-size: 11px; letter-spacing: .15em; color: var(--teal); width: 54px; flex: none; }
  .skills { display: flex; flex-direction: column; gap: 14px; }
  .skills .row { display: grid; grid-template-columns: 120px 1fr; gap: 12px; align-items: baseline; }
  .skills .row b { font-family: var(--mono); font-size: 11px; letter-spacing: .15em; color: var(--text-3); font-weight: 500; text-transform: uppercase; }
  .skills .row div { display: flex; flex-wrap: wrap; gap: 6px; }
  .skills .row span { font-size: 14px; padding: 4px 10px; border-radius: 7px; background: var(--panel-2); border: 1px solid var(--line); }
  .contact { display: flex; flex-direction: column; gap: 8px; font-size: 16px; }
  .contact a { color: var(--blue); font-weight: 500; }
  .contact a:hover { text-decoration: underline; }

  footer { border-top: 1px solid var(--line); padding-block: 36px 60px; color: var(--text-3); font-size: 14px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  footer .mono { font-size: 12.5px; }

  /* ---------- responsive ---------- */
  @media (max-width: 1000px) {
    .hero { grid-template-columns: 1fr; padding-block: 72px 56px; gap: 48px; }
    .card { grid-template-columns: 1fr; gap: 24px; padding: 28px; }
    .card .num { padding-top: 0; }
    .details { grid-column: 1 / -1; }
    .details-inner { grid-template-columns: 1fr; }
    .about { grid-template-columns: 1fr; gap: 40px; }
    .stats { grid-template-columns: 1fr; }
    .stat, .stat:first-child { border-left: none; border-top: 1px solid var(--line); padding: 28px 0; }
    .stat:first-child { border-top: none; }
    .navlinks { display: none; }
    .nav-status { display: none; }
    .wrap { padding: 0 20px; }
    nav .wrap { height: 68px; }
    .cta { width: 100%; font-size: 18px; padding: 20px 28px; }
  }
  @media print {
    nav, .cta, .expand { display: none !important; }
    .details { grid-template-rows: 1fr !important; }
    .card { break-inside: avoid; box-shadow: none; }
    section { padding-block: 40px; }
    .hero { padding-block: 20px; }
    .figure { display: none; }
  }
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <a class="brand" href="#top">
      <span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 3v18M12 3v18M16 3v18M3 8h18M3 12h18M3 16h18"/></svg></span>
      <span class="brand-name" id="brand"></span>
    </a>
    <div class="navlinks"><a href="#work">Selected Work</a><a href="#about">About</a></div>
  </div>
</nav>

<div class="hero-bg" id="top">
  <header class="hero wrap">
    <div>
      <h1 id="headline"></h1>
      <a class="cta" href="#work">Explore Selected Work <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10M17 8v9H8"/></svg></a>
    </div>

    <div class="figure" aria-hidden="true">
      <svg viewBox="0 0 640 400" fill="none">
        <defs>
          <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#c9c3e6"/></pattern>
        </defs>
        <rect x="0" y="0" width="640" height="400" fill="url(#dots)"/>
        <g stroke="#a48fe0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <!-- top pins -->
          <path d="M228 10v112M320 10v112M412 10v112"/>
          <!-- bottom pins -->
          <path d="M228 288v102M320 288v102M412 288v102"/>
          <!-- left traces -->
          <path d="M0 122h92v44h64"/>
          <path d="M0 240h60v-26h96"/>
          <path d="M0 330h64v-24h44v24h46"/>
          <!-- right traces -->
          <path d="M484 112h90v-24h66"/>
          <path d="M484 190h60v-70h96"/>
          <path d="M484 262h92v-30h64"/>
        </g>
        <g fill="#8b6fd6">
          <circle cx="92" cy="122" r="5.5"/><circle cx="60" cy="240" r="5.5"/>
          <circle cx="574" cy="112" r="5.5"/><circle cx="576" cy="262" r="5.5"/>
        </g>
        <!-- chip -->
        <rect x="156" y="122" width="328" height="166" rx="22" fill="#e6f5ef" stroke="#8fd3c0" stroke-width="2.5"/>
        <rect x="180" y="146" width="280" height="118" rx="10" fill="#f4f8fc" stroke="#9fb3d9" stroke-width="1.8"/>
        <text x="320" y="190" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="17" letter-spacing="6" fill="#1b2a41">DESIGN</text>
        <path d="M204 232h20v-20h20v20h20v-20h22v20h22v-20h22v20h22v-20h22v20h24v-20h18v20h20" stroke="#0e8f7e" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
      <div class="fig-foot"><span>Design</span><span class="arr">→</span><span>Verify</span><span class="arr">→</span><span>Demonstrate</span></div>
    </div>
  </header>

</div>

<main>
  <section id="work" class="wrap">
    <div class="sec-head">
      <div>
        <h2>Projects, in <em>order.</em></h2>
      </div>
    </div>
    <div class="work" id="work-list"></div>
  </section>

  <div class="about-bg">
    <section id="about" class="wrap">
      <div class="about">
        <div><h2 class="about-h2">About <em>myself.</em></h2><div id="about-text"></div></div>
        <div>
          <div class="side-block"><h4>Toolbox</h4><div class="skills" id="skills"></div></div>
          <div class="side-block"><h4>Contact</h4><div class="contact" id="contact"></div></div>
        </div>
      </div>
    </section>
  </div>
</main>

<footer class="wrap">
  <span id="foot-left"></span>
  <span>Last updated <span class="mono" id="foot-date"></span></span>
</footer>

<script src="projects.js"></script>
<script>
(function () {
  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const parse = d => { const [y, m, dd] = d.split("-").map(Number); return new Date(y, m - 1, dd || 1); };
  const fmt = d => { const x = parse(d); return `${MONTHS[x.getMonth()]} ${x.getFullYear()}`; };
  const fmtDay = d => { const x = parse(d); return `${MONTHS[x.getMonth()]} ${x.getDate()}, ${x.getFullYear()}`; };
  const STATUS = { "in-progress": "In progress", completed: "Completed", planned: "Planned" };
  const isTodo = s => /\bTODO\b/.test(s || "");
  const P = PROFILE;

  /* ---- nav + hero ---- */
  const parts = P.name.trim().split(/\s+/);
  $("#brand").innerHTML = parts.length > 1 ? `${esc(parts[0].toUpperCase())}<span>/</span>${esc(parts.slice(1).join(" ").toUpperCase())}` : esc(P.name.toUpperCase());
  const hl = P.headline || ["Hello,", "world."];
  $("#headline").innerHTML = `${esc(hl[0])} <em>${esc(hl[1])}</em>`;
  document.title = `${P.name} — Portfolio`;


  /* ---- work ---- */
  const order = { "in-progress": 0, completed: 1, planned: 2 };
  const sorted = [...PROJECTS].sort((a, b) => order[a.status] - order[b.status] || (a.status === "planned" ? parse(a.start) - parse(b.start) : parse(b.start) - parse(a.start)));
  $("#work-list").innerHTML = sorted.map((p, i) => {
    const ms = [...(p.milestones || [])].sort((a, b) => parse(b.date) - parse(a.date));
    const range = `${fmt(p.start)} — ${p.end ? fmt(p.end) : p.status === "planned" ? "upcoming" : "present"}`;
    return `
    <article class="card" id="p-${esc(p.id)}">
      <div class="num">${String(i + 1).padStart(2, "0")}</div>
      <div>
        <div class="card-meta"><span class="status ${esc(p.status)}">${STATUS[p.status] || esc(p.status)}</span><span class="date">${esc(range)}</span></div>
        <h3>${esc(p.title)}</h3>
        <p class="summary">${esc(p.summary)}</p>
        <div class="tech">${(p.tech || []).map(t => `<span>${esc(t)}</span>`).join("")}</div>
      </div>
      <div class="card-side">
        <h4>Latest milestones</h4>
        ${ms.length ? `<ul class="ms">${ms.slice(0, 3).map(m => `<li><span class="d">${esc(fmtDay(m.date))}</span>${esc(m.text)}</li>`).join("")}</ul>` : `<p class="summary">No milestones yet.</p>`}
        <div class="card-links">
          ${(p.links || []).map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join("")}
          <button class="expand" aria-expanded="false">Full write-up <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></button>
        </div>
      </div>
      <div class="details"><div><div class="details-inner">
        <div>
          <h4>About</h4><p class="${isTodo(p.description) ? "todo" : ""}">${esc(p.description)}</p>
          ${(p.highlights || []).length ? `<h4>Highlights</h4><ul class="hl">${p.highlights.map(h => `<li class="${isTodo(h) ? "todo" : ""}">${esc(h)}</li>`).join("")}</ul>` : ""}
        </div>
        <div>
          <h4>All milestones</h4>
          ${ms.length ? `<ul class="ms">${[...ms].reverse().map(m => `<li><span class="d">${esc(fmtDay(m.date))}</span>${esc(m.text)}</li>`).join("")}</ul>` : ""}
        </div>
      </div></div></div>
    </article>`;
  }).join("");
  document.querySelectorAll(".expand").forEach(b => b.onclick = () => {
    const c = b.closest(".card"); b.setAttribute("aria-expanded", c.classList.toggle("open"));
  });

  /* ---- about ---- */
  const live = PROJECTS.filter(p => p.status === "in-progress");
  const next = PROJECTS.filter(p => p.status === "planned").sort((a, b) => parse(a.start) - parse(b.start));
  const done = PROJECTS.filter(p => p.status === "completed");
  $("#about-text").innerHTML = `<p>${esc(P.bio || P.tagline)}</p>`;

  const count = {};
  PROJECTS.forEach(p => (p.tech || []).forEach(t => count[t] = (count[t] || 0) + 1));
  const groups = typeof SKILL_GROUPS !== "undefined" ? { ...SKILL_GROUPS } : {};
  const placed = new Set(Object.values(groups).flat());
  const other = Object.keys(count).filter(t => !placed.has(t));
  if (other.length) groups["Other"] = other;
  $("#skills").innerHTML = Object.entries(groups).map(([g, list]) => {
    const items = list.filter(t => count[t]);
    return items.length ? `<div class="row"><b>${esc(g)}</b><div>${items.map(t => `<span>${esc(t)}</span>`).join("")}</div></div>` : "";
  }).join("");

  const cl = [];
  if (P.email) cl.push(`<a href="mailto:${esc(P.email)}">${esc(P.email)}</a>`);
  (P.links || []).forEach(l => cl.push(`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`));
  if (P.location) cl.push(`<span>${esc(P.location)}</span>`);
  $("#contact").innerHTML = cl.join("");

  /* ---- footer + deep link ---- */
  $("#foot-left").textContent = `© ${new Date().getFullYear()} ${P.name}`;
  const latest = PROJECTS.flatMap(p => (p.milestones || []).map(m => m.date)).sort().pop();
  $("#foot-date").textContent = latest ? fmtDay(latest) : "";
  const openHash = () => { if (location.hash.startsWith("#p-")) { const c = $(location.hash); if (c) c.classList.add("open"); } };
  addEventListener("hashchange", openHash); openHash();
})();
</script>
</body>
</html>
