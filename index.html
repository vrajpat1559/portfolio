<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vraj — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ---------- tokens ---------- */
  :root {
    --bg: #f6f7f5;
    --panel: #ffffff;
    --panel-2: #eef1ee;
    --line: #e4e8e3;
    --line-strong: #c8cfc6;
    --text: #14201a;
    --text-2: #4b5852;
    --text-3: #8a978f;
    --accent: #1a9d5a;
    --accent-soft: #e3f4ea;
    --accent-ink: #ffffff;
    --ok: #1a9d5a;
    --ok-soft: #e3f4ea;
    --live: #b9791a;
    --live-soft: #f6edda;
    --plan: #6b7480;
    --plan-soft: #edeff1;
    --shadow: 0 1px 2px rgba(20,32,26,.04);
    --radius: 12px;
    --head: "Space Grotesk", "Inter", system-ui, sans-serif;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  [data-theme="dark"] {
    --bg: #0d120f;
    --panel: #131a15;
    --panel-2: #1a231d;
    --line: #232e27;
    --line-strong: #36453b;
    --text: #e8efe9;
    --text-2: #a6b3aa;
    --text-3: #6e7c72;
    --accent: #43d383;
    --accent-soft: #133021;
    --accent-ink: #08120c;
    --ok: #43d383;
    --ok-soft: #133021;
    --live: #e0a54a;
    --live-soft: #33270d;
    --plan: #8b96a0;
    --plan-soft: #20262a;
    --shadow: 0 10px 30px -18px rgba(0,0,0,.55);
  }

  /* ---------- base ---------- */
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15.5px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  h1, h2, h3, h4 { font-family: var(--head); margin: 0; letter-spacing: -.01em; }
  .mono { font-family: var(--mono); font-size: 12.5px; }
  .muted { color: var(--text-2); }
  .dim { color: var(--text-3); }

  /* ---------- layout: sidebar + content ---------- */
  .layout { display: grid; grid-template-columns: 300px 1fr; min-height: 100vh; }
  aside {
    position: sticky; top: 0; height: 100vh; padding: 40px 32px;
    border-right: 1px solid var(--line); background: var(--panel);
    display: flex; flex-direction: column; gap: 28px;
  }
  .avatar {
    width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center;
    background: var(--accent); color: var(--accent-ink);
    font-family: var(--head); font-weight: 700; font-size: 22px;
  }
  aside h1 { font-size: 26px; font-weight: 700; line-height: 1.15; margin-top: 14px; }
  aside .role { color: var(--text-2); margin-top: 4px; font-size: 14.5px; }
  .now { display: flex; gap: 8px; align-items: flex-start; padding: 12px; border-radius: 12px; background: var(--accent-soft); font-size: 13px; color: var(--text-2); line-height: 1.45; }
  .now .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-top: 6px; flex: none; box-shadow: 0 0 0 0 var(--accent); animation: pulse 2s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); } 100% { box-shadow: 0 0 0 10px transparent; } }
  .now b { color: var(--text); font-weight: 600; }
  .sidenav { display: flex; flex-direction: column; gap: 2px; }
  .sidenav a {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px;
    color: var(--text-2); font-size: 14px; font-weight: 500; transition: .15s;
  }
  .sidenav a .n { font-family: var(--mono); font-size: 11px; color: var(--text-3); width: 18px; }
  .sidenav a:hover, .sidenav a.active { background: var(--panel-2); color: var(--text); }
  .sidenav a.active .n { color: var(--accent); }
  .side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 12px; }
  .contact-list { display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; }
  .contact-list a { color: var(--text-2); display: flex; gap: 8px; align-items: center; }
  .contact-list a:hover { color: var(--accent); }
  .contact-list svg { width: 15px; height: 15px; flex: none; }
  .side-actions { display: flex; gap: 8px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 8px 14px; border-radius: 10px; font-size: 13.5px; font-weight: 500; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--text); font-family: var(--sans); transition: .15s;
  }
  .btn:hover { border-color: var(--line-strong); background: var(--panel-2); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn svg { width: 15px; height: 15px; }
  .btn.icon { padding: 8px; }

  main { padding: 48px 56px 80px; max-width: 1100px; }
  section { padding: 0 0 64px; scroll-margin-top: 24px; }
  .sec-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 22px; }
  .sec-head .n { font-family: var(--mono); font-size: 12px; color: var(--accent); }
  h2 { font-size: 26px; font-weight: 600; }
  .sec-head .sub { color: var(--text-3); font-size: 13.5px; margin-left: auto; }

  /* ---------- about ---------- */
  .intro { font-family: var(--head); font-size: clamp(26px, 3.2vw, 40px); font-weight: 600; line-height: 1.2; max-width: 22ch; margin-bottom: 22px; }
  .intro mark { background: none; color: var(--accent); }
  .about-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 24px; align-items: start; }
  .about-grid p { margin: 0 0 12px; color: var(--text-2); max-width: 60ch; }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .fact { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .fact b { display: block; font-family: var(--head); font-size: 24px; font-weight: 600; line-height: 1.1; }
  .fact span { font-size: 12px; color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; }

  /* ---------- roadmap (gantt) ---------- */
  .gantt { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px 14px; overflow-x: auto; }
  .gantt-inner { min-width: 620px; display: grid; grid-template-columns: 200px 1fr; row-gap: 10px; align-items: center; }
  .g-head { font-family: var(--mono); font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .08em; }
  .g-months { position: relative; height: 22px; border-bottom: 1px solid var(--line); }
  .g-months span { position: absolute; top: 0; font-family: var(--mono); font-size: 11px; color: var(--text-3); transform: translateX(-50%); white-space: nowrap; }
  .g-label { font-size: 14px; font-weight: 500; padding-right: 14px; display: flex; flex-direction: column; line-height: 1.25; }
  .g-label small { font-family: var(--mono); font-size: 11px; color: var(--text-3); font-weight: 400; margin-top: 2px; }
  .g-track { position: relative; height: 30px; background-image: linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: var(--month-w) 100%; border-radius: 6px; }
  .g-bar {
    position: absolute; top: 4px; height: 22px; border-radius: 6px; font-family: var(--mono); font-size: 11px;
    display: flex; align-items: center; padding: 0 8px; white-space: nowrap; overflow: hidden; cursor: pointer; transition: .15s;
    border: 1px solid transparent;
  }
  .g-bar:hover { filter: brightness(.96); transform: translateY(-1px); }
  .g-bar.in-progress { background: var(--live-soft); color: var(--live); border-color: color-mix(in srgb, var(--live) 40%, transparent); }
  .g-bar.completed   { background: var(--ok-soft);   color: var(--ok);   border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
  .g-bar.planned     { background: var(--plan-soft); color: var(--plan); border-style: dashed; border-color: color-mix(in srgb, var(--plan) 50%, transparent); }
  .g-bar .ms { position: absolute; top: 50%; width: 6px; height: 6px; border-radius: 50%; background: currentColor; transform: translate(-50%, -50%); opacity: .8; }
  .gantt-inner { position: relative; }
  .g-today { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px dashed var(--accent); pointer-events: none; z-index: 2; }
  .g-today::after { content: "today"; position: absolute; bottom: -6px; left: 5px; font-family: var(--mono); font-size: 10px; color: var(--accent); background: var(--panel); padding: 0 3px; border-radius: 3px; }
  .g-rows { display: contents; }
  .g-track-wrap { position: relative; }
  .legend { display: flex; gap: 16px; margin-top: 14px; font-size: 12.5px; color: var(--text-2); flex-wrap: wrap; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; border: 1px solid transparent; }
  .legend .l1 { background: var(--live-soft); border-color: var(--live); }
  .legend .l2 { background: var(--ok-soft); border-color: var(--ok); }
  .legend .l3 { background: var(--plan-soft); border-color: var(--plan); border-style: dashed; }

  /* ---------- projects grid ---------- */
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  .chip { padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--text-2); font-size: 12.5px; cursor: pointer; font-family: var(--sans); }
  .chip:hover { border-color: var(--line-strong); color: var(--text); }
  .chip.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .pcard {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 22px; display: flex; flex-direction: column; gap: 12px; transition: .2s; position: relative; scroll-margin-top: 24px;
  }
  .pcard:hover { border-color: var(--line-strong); transform: translateY(-2px); }
  .pcard.featured { grid-column: span 2; }
  .pcard.hidden { display: none; }
  .pcard-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .status { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .status.in-progress { color: var(--live); background: var(--live-soft); }
  .status.completed   { color: var(--ok);   background: var(--ok-soft); }
  .status.planned     { color: var(--plan); background: var(--plan-soft); }
  .pcard h3 { font-size: 21px; font-weight: 600; line-height: 1.2; }
  .pcard .summary { color: var(--text-2); margin: 0; }
  .pcard.featured .summary { max-width: 70ch; }
  .tech { display: flex; gap: 6px; flex-wrap: wrap; }
  .tech span { font-family: var(--mono); font-size: 11px; padding: 3px 8px; border-radius: 6px; background: var(--panel-2); color: var(--text-2); }
  .pcard-foot { display: flex; align-items: center; gap: 14px; margin-top: auto; padding-top: 6px; }
  .pcard-foot a { color: var(--accent); font-weight: 500; font-size: 13.5px; }
  .pcard-foot a:hover { text-decoration: underline; }
  .expand { margin-left: auto; background: none; border: none; cursor: pointer; color: var(--text-2); font-family: var(--sans); font-size: 13px; display: inline-flex; align-items: center; gap: 5px; padding: 0; }
  .expand:hover { color: var(--text); }
  .expand svg { width: 14px; height: 14px; transition: .2s; }
  .pcard.open .expand svg { transform: rotate(180deg); }
  .details { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s ease; }
  .pcard.open .details { grid-template-rows: 1fr; }
  .details > div { overflow: hidden; }
  .details-inner { border-top: 1px solid var(--line); padding-top: 16px; display: grid; grid-template-columns: 1.3fr 1fr; gap: 24px; }
  .pcard:not(.featured) .details-inner { grid-template-columns: 1fr; }
  .details h4 { font-family: var(--sans); font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); font-weight: 600; margin-bottom: 8px; }
  .details p { margin: 0 0 12px; color: var(--text-2); font-size: 14.5px; }
  .highlights { margin: 0; padding-left: 18px; color: var(--text-2); font-size: 14px; }
  .highlights li { margin-bottom: 5px; }
  .highlights li::marker { color: var(--accent); }
  .milestones { list-style: none; margin: 0; padding: 0; border-left: 2px solid var(--line); }
  .milestones li { position: relative; padding: 0 0 10px 14px; font-size: 13.5px; color: var(--text-2); }
  .milestones li::before { content: ""; position: absolute; left: -5px; top: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .milestones .d { display: block; font-family: var(--mono); font-size: 11px; color: var(--text-3); }
  .todo { color: var(--plan) !important; font-family: var(--mono); font-size: 12.5px !important; }

  /* ---------- skills ---------- */
  .skill-groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  .sgroup { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  .sgroup h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-3); font-weight: 600; font-family: var(--sans); margin-bottom: 12px; }
  .sgroup ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .sgroup li { display: flex; justify-content: space-between; align-items: center; font-size: 14.5px; font-weight: 500; }
  .sgroup li .bar { flex: 1; height: 4px; margin: 0 12px; background: var(--panel-2); border-radius: 2px; overflow: hidden; }
  .sgroup li .bar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
  .sgroup li small { font-family: var(--mono); font-size: 11px; color: var(--text-3); white-space: nowrap; }

  /* ---------- activity log ---------- */
  .log { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .log-row { display: grid; grid-template-columns: 120px 1fr auto; gap: 16px; align-items: center; padding: 12px 20px; border-top: 1px solid var(--line); font-size: 14px; }
  .log-row:first-child { border-top: none; }
  .log-row:hover { background: var(--panel-2); }
  .log-row .d { font-family: var(--mono); font-size: 12px; color: var(--text-3); }
  .log-row .p { font-family: var(--mono); font-size: 11px; color: var(--accent); background: var(--accent-soft); padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
  .log-more { padding: 12px 20px; border-top: 1px solid var(--line); }
  .log-more button { background: none; border: none; color: var(--accent); cursor: pointer; font-family: var(--sans); font-size: 13.5px; font-weight: 500; padding: 0; }

  footer { color: var(--text-3); font-size: 13px; border-top: 1px solid var(--line); padding-top: 24px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }

  /* ---------- responsive ---------- */
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    aside { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--line); padding: 28px 24px; }
    .sidenav { flex-direction: row; flex-wrap: wrap; }
    .sidenav a .n { display: none; }
    .side-foot { margin-top: 0; }
    main { padding: 32px 24px 60px; }
    .about-grid, .grid { grid-template-columns: 1fr; }
    .pcard.featured { grid-column: span 1; }
    .details-inner { grid-template-columns: 1fr !important; }
    .log-row { grid-template-columns: 1fr; gap: 4px; }
    .sec-head { flex-wrap: wrap; }
    .filters { margin-left: 0; width: 100%; }
  }

  /* ---------- print ---------- */
  @media print {
    :root, [data-theme="dark"] { --bg: #fff; --panel: #fff; --panel-2: #f3f3f3; --line: #ddd; --line-strong: #bbb; --text: #111; --text-2: #333; --text-3: #666; --accent: #15803d; --accent-soft: #e6f4ec; --shadow: none; }
    .layout { grid-template-columns: 1fr; }
    aside { position: static; height: auto; border: none; padding: 0 0 16px; }
    .sidenav, .side-actions, .filters, .expand, .log-more, .now .pulse { display: none !important; }
    main { padding: 0; max-width: none; }
    section { padding-bottom: 28px; break-inside: avoid; }
    .details { grid-template-rows: 1fr !important; }
    .pcard { box-shadow: none; break-inside: avoid; }
    .pcard.hidden { display: flex; }
    .log-row.extra { display: grid !important; }
    a[href^="http"]::after { content: " (" attr(href) ")"; font-size: 10px; color: #666; }
  }
</style>
</head>
<body>
<div class="layout">

  <aside>
    <div>
      <div class="avatar" id="avatar">V</div>
      <h1 id="name"></h1>
      <div class="role" id="role"></div>
    </div>

    <div class="now" id="now"></div>

    <nav class="sidenav" id="sidenav">
      <a href="#about"><span class="n">01</span>About</a>
      <a href="#projects"><span class="n">02</span>Projects</a>
      <a href="#skills"><span class="n">03</span>Skills</a>
      <a href="#activity"><span class="n">04</span>Activity</a>
    </nav>

    <div class="side-foot">
      <div class="contact-list" id="contact-list"></div>
      <div class="side-actions">
        <button class="btn primary" id="print" title="Print / save as PDF">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
          Save as PDF
        </button>
        <button class="btn icon" id="theme" title="Toggle theme" aria-label="Toggle theme">
          <svg id="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg id="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <main>
    <section id="about">
      <p class="intro" id="intro"></p>
      <div class="about-grid">
        <div id="about-text"></div>
        <div class="facts" id="facts"></div>
      </div>
    </section>

    <section id="projects">
      <div class="sec-head"><span class="n">02</span><h2>Projects</h2><div class="filters" id="filters"></div></div>
      <div class="grid" id="grid"></div>
    </section>

    <section id="skills">
      <div class="sec-head"><span class="n">03</span><h2>Skills</h2><span class="sub">bar = how many projects use it</span></div>
      <div class="skill-groups" id="skill-groups"></div>
    </section>

    <section id="activity">
      <div class="sec-head"><span class="n">04</span><h2>Activity log</h2><span class="sub">every milestone, newest first</span></div>
      <div class="log" id="log"></div>
    </section>

    <footer>
      <span id="foot-left"></span>
      <span>Last updated <span id="foot-date" class="mono"></span></span>
    </footer>
  </main>
</div>

<script src="projects.js"></script>
<script>
(function () {
  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const parse = d => { const [y, m, dd] = d.split("-").map(Number); return new Date(y, m - 1, dd || 1); };
  const fmt = d => { const x = parse(d); return `${MONTHS[x.getMonth()]} ${x.getFullYear()}`; };
  const fmtDay = d => { const x = parse(d); return `${MONTHS[x.getMonth()]} ${x.getDate()}, ${x.getFullYear()}`; };
  const STATUS = { "in-progress": "In progress", completed: "Completed", planned: "Planned" };
  const isTodo = s => /\bTODO\b/.test(s || "");
  const today = new Date();

  /* ---- theme ---- */
  const root = document.documentElement;
  const setTheme = t => {
    root.dataset.theme = t;
    $("#ico-sun").style.display = t === "dark" ? "" : "none";
    $("#ico-moon").style.display = t === "dark" ? "none" : "";
    try { localStorage.setItem("theme-v2", t); } catch (e) {}
  };
  let saved = null; try { saved = localStorage.getItem("theme-v2"); } catch (e) {}
  setTheme(saved || "light");
  $("#theme").onclick = () => setTheme(root.dataset.theme === "dark" ? "light" : "dark");
  $("#print").onclick = () => window.print();

  /* ---- sidebar ---- */
  document.title = `${PROFILE.name} — Portfolio`;
  $("#avatar").textContent = PROFILE.name.split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase();
  $("#name").textContent = PROFILE.name;
  $("#role").textContent = PROFILE.title;
  const live = PROJECTS.filter(p => p.status === "in-progress");
  const next = PROJECTS.filter(p => p.status === "planned").sort((a, b) => parse(a.start) - parse(b.start))[0];
  $("#now").innerHTML = `<span class="pulse"></span><span>${live.length ? `<b>Now:</b> ${live.map(p => esc(p.title)).join(", ")}` : ""}${next ? `<br><b>Next:</b> ${esc(next.title)}` : ""}</span>`;

  const ico = {
    mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
    link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>',
    pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  };
  const cl = [];
  if (PROFILE.email) cl.push(`<a href="mailto:${esc(PROFILE.email)}">${ico.mail}${esc(PROFILE.email)}</a>`);
  if (PROFILE.location) cl.push(`<span class="dim" style="display:flex;gap:8px;align-items:center">${ico.pin}${esc(PROFILE.location)}</span>`);
  PROFILE.links.forEach(l => cl.push(`<a href="${esc(l.url)}" target="_blank" rel="noopener">${ico.link}${esc(l.label)}</a>`));
  $("#contact-list").innerHTML = cl.join("");

  /* ---- about ---- */
  $("#intro").innerHTML = esc(PROFILE.tagline).replace(/^(\S+\s+\S+\s+\S+)/, "<mark>$1</mark>");
  const allTech = [...new Set(PROJECTS.flatMap(p => p.tech || []))];
  const starts = PROJECTS.map(p => parse(p.start)).sort((a, b) => a - b);
  const milestoneCount = PROJECTS.reduce((n, p) => n + (p.milestones || []).length, 0);
  $("#about-text").innerHTML = `
    <p>I'm ${esc(PROFILE.name)}, ${esc(PROFILE.title.replace(/^an?\s/i, "").toLowerCase())}. My projects so far center on digital design: writing synthesizable RTL, verifying it properly with self-checking testbenches, and pushing toward industry verification practice.</p>
    <p>Right now I'm ${live.length ? `finishing <strong>${esc(live[0].title)}</strong>` : "between projects"}${live.length > 1 ? ` while building <strong>${esc(live[1].title)}</strong>` : ""}${next ? `, with <strong>${esc(next.title)}</strong> up next` : ""}.</p>`;
  $("#facts").innerHTML = [
    [PROJECTS.length, "projects"],
    [milestoneCount, "milestones"],
    [allTech.length, "technologies"],
    ["May '26", "building since"],
  ].map(([b, s]) => `<div class="fact"><b>${esc(b)}</b><span>${s}</span></div>`).join("");

  /* ---- projects grid ---- */
  const tags = [...new Set(PROJECTS.flatMap(p => p.tags || []))].sort();
  let active = "all";
  const renderFilters = () => {
    $("#filters").innerHTML = ["all", ...tags].map(t => `<button class="chip ${t === active ? "active" : ""}" data-tag="${esc(t)}">${t === "all" ? "All" : esc(t)}</button>`).join("");
    $("#filters").querySelectorAll(".chip").forEach(c => c.onclick = () => { active = c.dataset.tag; renderFilters(); applyFilter(); });
  };
  const applyFilter = () => document.querySelectorAll(".pcard").forEach(el =>
    el.classList.toggle("hidden", !(active === "all" || el.dataset.tags.split("|").includes(active))));

  const order = { "in-progress": 0, completed: 1, planned: 2 };
  const sorted = [...PROJECTS].sort((a, b) => (b.featured ? 1 : 0) - (a.featured ? 1 : 0) || order[a.status] - order[b.status] || parse(b.start) - parse(a.start));
  $("#grid").innerHTML = sorted.map(p => {
    const ms = [...(p.milestones || [])].sort((a, b) => parse(a.date) - parse(b.date));
    return `
    <article class="pcard ${p.featured ? "featured" : ""}" id="p-${esc(p.id)}" data-tags="${esc((p.tags || []).join("|"))}">
      <div class="pcard-top">
        <span class="status ${esc(p.status)}">${STATUS[p.status] || esc(p.status)}</span>
        <span class="mono dim">${esc(fmt(p.start))} – ${p.end ? esc(fmt(p.end)) : p.status === "planned" ? "upcoming" : "present"}</span>
      </div>
      <h3>${esc(p.title)}</h3>
      <p class="summary">${esc(p.summary)}</p>
      <div class="tech">${(p.tech || []).map(t => `<span>${esc(t)}</span>`).join("")}</div>
      <div class="pcard-foot">
        ${(p.links || []).map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join("")}
        <button class="expand" aria-expanded="false">Details <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></button>
      </div>
      <div class="details"><div><div class="details-inner">
        <div>
          <h4>About</h4><p class="${isTodo(p.description) ? "todo" : ""}">${esc(p.description)}</p>
          ${(p.highlights || []).length ? `<h4>Highlights</h4><ul class="highlights">${p.highlights.map(h => `<li class="${isTodo(h) ? "todo" : ""}">${esc(h)}</li>`).join("")}</ul>` : ""}
        </div>
        <div>
          <h4>Milestones</h4>
          ${ms.length ? `<ul class="milestones">${ms.map(m => `<li><span class="d">${esc(fmtDay(m.date))}</span>${esc(m.text)}</li>`).join("")}</ul>` : `<p class="dim">No milestones yet.</p>`}
        </div>
      </div></div></div>
    </article>`;
  }).join("");
  document.querySelectorAll(".expand").forEach(b => b.onclick = () => {
    const c = b.closest(".pcard"); b.setAttribute("aria-expanded", c.classList.toggle("open"));
  });
  renderFilters(); applyFilter();

  /* ---- skills ---- */
  const count = {};
  PROJECTS.forEach(p => (p.tech || []).forEach(t => count[t] = (count[t] || 0) + 1));
  const max = Math.max(1, ...Object.values(count));
  const groups = typeof SKILL_GROUPS !== "undefined" ? { ...SKILL_GROUPS } : {};
  const placed = new Set(Object.values(groups).flat());
  const other = Object.keys(count).filter(t => !placed.has(t));
  if (other.length) groups["Other"] = other;
  $("#skill-groups").innerHTML = Object.entries(groups).map(([name, list]) => {
    const items = list.filter(t => count[t]).sort((a, b) => count[b] - count[a]);
    if (!items.length) return "";
    return `<div class="sgroup"><h3>${esc(name)}</h3><ul>${items.map(t =>
      `<li><span>${esc(t)}</span><span class="bar"><i style="width:${(count[t] / max * 100).toFixed(0)}%"></i></span><small>${count[t]} proj</small></li>`).join("")}</ul></div>`;
  }).join("");

  /* ---- activity log ---- */
  const events = PROJECTS.flatMap(p => (p.milestones || []).map(m => ({ ...m, project: p.title, id: p.id })))
    .filter(e => parse(e.date) <= today)
    .sort((a, b) => parse(b.date) - parse(a.date));
  const LIMIT = 6;
  $("#log").innerHTML = events.map((e, i) => `
    <div class="log-row ${i >= LIMIT ? "extra" : ""}" ${i >= LIMIT ? 'style="display:none"' : ""}>
      <span class="d">${esc(fmtDay(e.date))}</span><span>${esc(e.text)}</span><a class="p" href="#p-${esc(e.id)}">${esc(e.project)}</a>
    </div>`).join("") + (events.length > LIMIT ? `<div class="log-more"><button id="more">Show ${events.length - LIMIT} more</button></div>` : "") + (events.length ? "" : `<div class="log-row dim">No activity yet.</div>`);
  const more = $("#more");
  if (more) more.onclick = () => { document.querySelectorAll(".log-row.extra").forEach(r => r.style.display = ""); more.parentElement.remove(); };

  /* ---- footer + scroll spy + deep link ---- */
  $("#foot-left").textContent = `© ${today.getFullYear()} ${PROFILE.name}`;
  $("#foot-date").textContent = events.length ? fmtDay(events[0].date) : "";
  const links = [...document.querySelectorAll(".sidenav a")];
  const secs = links.map(a => $(a.getAttribute("href")));
  const spy = () => {
    const y = scrollY + 120; let cur = 0;
    secs.forEach((s, i) => { if (s && s.offsetTop <= y) cur = i; });
    links.forEach((a, i) => a.classList.toggle("active", i === cur));
  };
  addEventListener("scroll", spy, { passive: true }); spy();
  const openHash = () => { if (location.hash.startsWith("#p-")) { const c = $(location.hash); if (c) c.classList.add("open"); } };
  addEventListener("hashchange", openHash); openHash();
})();
</script>
</body>
</html>
